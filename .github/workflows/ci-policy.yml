name: CI Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-lane-whitelist:
    name: CI Lane Whitelist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tree-sitter development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libtree-sitter-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: adze-xtask-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build xtask
        run: cargo build -p xtask --bin xtask
      - name: Run CI lane whitelist lint (advisory)
        run: |
          mkdir -p target
          set +e
          cargo run -q -p xtask -- check-ci-lane-whitelist --mode advisory > target/ci-lane-whitelist.log 2>&1
          status=$?
          set -e
          cat target/ci-lane-whitelist.log
          exit $status
      - name: Upload whitelist receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lane-whitelist-receipt
          path: |
            target/policy/ci-lane-whitelist.json
            target/ci-lane-whitelist.log
          if-no-files-found: warn
      - name: Append to step summary
        if: always()
        run: |
          {
            echo "## CI Lane Whitelist (advisory)";
            echo "";
            echo '```';
            cat target/ci-lane-whitelist.log || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
