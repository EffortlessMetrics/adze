name: Fuzz Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# PR-default fuzz runtime is gated behind explicit labels because each fuzz
# target costs ~5 wall-clock minutes per run. See docs/ci/adze-rollout-plan.md
# (PR 10) and policy/ci-lane-whitelist.toml lane id `fuzz-pr`.

jobs:
  fuzz:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'fuzz') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fuzz-target:
          - fuzz_lexer_simple
          - fuzz_glr_parser
          - fuzz_incremental_edits
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Install nightly toolchain
      uses: dtolnay/rust-toolchain@nightly
    
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked
    
    - name: Cache cargo registry
      uses: actions/cache@v5.0.3
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-fuzz-

    - name: Run fuzzer
      run: |
        cd runtime
        cargo +nightly fuzz run ${{ matrix.fuzz-target }} -- -max_total_time=300 -print_final_stats=1
      env:
        RUST_BACKTRACE: 1
    
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: fuzz-crash-${{ matrix.fuzz-target }}
        path: runtime/fuzz/artifacts/

  # Separate job for longer nightly fuzzing
  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fuzz-target:
          - fuzz_lexer_simple
          - fuzz_glr_parser
          - fuzz_incremental_edits
    steps:
    - uses: actions/checkout@v6.0.2
    
    - name: Install nightly toolchain
      uses: dtolnay/rust-toolchain@nightly
    
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked
    
    - name: Cache cargo registry
      uses: actions/cache@v5.0.3
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-fuzz-

    - name: Run extended fuzzing
      run: |
        cd runtime
        # Run for 30 minutes on nightly builds
        cargo +nightly fuzz run ${{ matrix.fuzz-target }} -- -max_total_time=1800 -print_final_stats=1
      env:
        RUST_BACKTRACE: 1
    
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: fuzz-crash-nightly-${{ matrix.fuzz-target }}
        path: runtime/fuzz/artifacts/

  fuzz-build-smoke:
    # Cheap PR-default check: fuzz harness still compiles. Runs on parser/glr
    # changes via paths filter, without burning the 5-minute fuzz runtime.
    if: |
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'fuzz') &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # Need both base and head reachable for the diff below.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: adze-fuzz-build-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Detect parser/glr risk pack
        id: risk
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)
          if echo "$changed" | grep -qE '^(glr-core/|runtime/|runtime/fuzz/|crates/parser-)'; then
            echo "needs_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_smoke=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-fuzz
        if: steps.risk.outputs.needs_smoke == 'true'
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz harness (smoke)
        if: steps.risk.outputs.needs_smoke == 'true'
        run: |
          cd runtime
          cargo +nightly fuzz build fuzz_glr_parser