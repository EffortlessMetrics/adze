name: ripr advisory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  plan:
    name: PR Plan
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-plan.yml

  ripr:
    name: ripr advisory
    needs: plan
    # Skip on docs-only PRs and on workflow_dispatch with no diff context.
    if: |
      always() &&
      (needs.plan.result == 'skipped' || needs.plan.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Resolve base/head SHAs
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          else
            BASE_SHA="$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Install ripr (advisory, graceful on failure)
        id: ripr-install
        run: |
          set -euo pipefail
          if rustup toolchain install 1.95 --no-self-update --profile minimal \
            && cargo +1.95 install --locked ripr 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ripr --version || true
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ripr install unavailable; xtask will emit advisory stub artifacts."
          fi

      - name: RIPR PR evidence
        env:
          RIPR_BIN: ripr
        run: cargo xtask ripr-pr --base "${{ steps.shas.outputs.base }}" --head "${{ steps.shas.outputs.head }}"

      - name: RIPR review guidance
        env:
          RIPR_BIN: ripr
        run: cargo xtask ripr-review-comments --base "${{ steps.shas.outputs.base }}" --head "${{ steps.shas.outputs.head }}"

      - name: RIPR PR contract
        if: always()
        run: |
          cargo xtask ripr-pr --check
          cargo xtask ripr-review-comments --check

      - name: RIPR annotations
        if: always()
        run: python scripts/ripr-annotations.py

      - name: RIPR review summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RIPR Review Guidance"
            echo
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RIPR PR evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn

      - name: Upload RIPR review guidance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn
