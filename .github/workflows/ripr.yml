name: ripr advisory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  plan:
    name: PR Plan
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-plan.yml

  ripr:
    name: ripr advisory
    needs: plan
    # Skip on docs-only PRs and on workflow_dispatch with no diff context.
    if: |
      always() &&
      (needs.plan.result == 'skipped' || needs.plan.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Resolve base/head SHAs
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install ripr (advisory, graceful on failure)
        id: ripr-install
        # ripr requires Rust 1.93+; adze MSRV stays at 1.92.0. Keep both the
        # isolated toolchain install and ripr install on the graceful path.
        run: |
          set -euo pipefail
          if rustup toolchain install 1.93 --no-self-update --profile minimal --quiet \
            && cargo +1.93 install --locked ripr 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ripr --version || true
          else
            # ripr may not yet be published to crates.io; keep graceful fallback.
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ripr or Rust 1.93 install unavailable; using stub report."
          fi
      - name: Run ripr (advisory)
        if: steps.ripr-install.outputs.available == 'true'
        env:
          BASE_SHA: ${{ steps.shas.outputs.base }}
          HEAD_SHA: ${{ steps.shas.outputs.head }}
        run: |
          set -euo pipefail
          mkdir -p target/ripr
          ripr analyze \
            --config ripr.toml \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --json target/ripr/ripr-report.json \
            --sarif target/ripr/ripr-report.sarif \
            || echo "ripr exited non-zero (advisory)."
      - name: Stub report (ripr not available)
        if: steps.ripr-install.outputs.available != 'true'
        run: |
          set -euo pipefail
          mkdir -p target/ripr
          cat > target/ripr/ripr-report.json <<'JSON'
          {
            "schema_version": 1,
            "status": "skipped",
            "reason": "ripr binary not available via cargo install; will activate when published to crates.io."
          }
          JSON
      - name: Upload ripr report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripr-report
          path: target/ripr/
          if-no-files-found: warn
      - name: Append summary
        if: always()
        run: |
          {
            echo "## ripr advisory";
            echo "";
            if [ "${{ steps.ripr-install.outputs.available }}" = "true" ]; then
              echo "- ripr installed via Rust 1.93 toolchain; analysis ran on \`${{ steps.shas.outputs.base }}..${{ steps.shas.outputs.head }}\`."
            else
              echo "- ripr install attempted (Rust 1.93, cargo install --locked ripr) but not available yet; stub report uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
