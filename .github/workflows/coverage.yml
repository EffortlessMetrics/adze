name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "runtime2/**"
      - "macro/**"
      - "tool/**"
      - "common/**"
      - "ir/**"
      - "glr-core/**"
      - "tablegen/**"
      - "crates/**"
      - "testing/**"
      - "xtask/**"
      - ".github/workflows/coverage.yml"
      - "codecov.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "runtime2/**"
      - "macro/**"
      - "tool/**"
      - "common/**"
      - "ir/**"
      - "glr-core/**"
      - "tablegen/**"
      - "crates/**"
      - "testing/**"
      - "xtask/**"
      - ".github/workflows/coverage.yml"
      - "codecov.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TEST_THREADS: 2
  RAYON_NUM_THREADS: 4
  CARGO_BUILD_JOBS: 4
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  coverage:
    name: Codecov Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'coverage') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: llvm-tools-preview

      - name: Use larger target dir
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/target" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ runner.temp }}/target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Generate coverage
        env:
          CI: true
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace

          cargo llvm-cov nextest \
            --workspace \
            --locked \
            --no-report \
            --profile ci

          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --text | tee coverage.txt

      - name: Validate coverage output
        run: |
          set -euo pipefail
          test -s coverage.json
          test -s lcov.info
          test -s coverage.txt

      - name: Generate coverage receipt
        run: |
          set -euo pipefail
          mkdir -p target/coverage
          python3 - <<'PYTHON'
          import json
          import pathlib

          receipt = {
              "schema_version": 1,
              "repo": "EffortlessMetrics/adze",
              "lane": "coverage",
              "workflow": "Coverage",
              "runner": "ubuntu_latest",
              "base_lem": 45,
              "flag": "rust-core",
              "kind": "execution_surface",
              "artifacts": {
                  "coverage_json": pathlib.Path("coverage.json").exists(),
                  "coverage_text": pathlib.Path("coverage.txt").exists(),
                  "lcov": pathlib.Path("lcov.info").exists(),
              },
              "claim_boundary": [
                  "execution_surface_only",
                  "not_parser_correctness",
                  "not_glr_correctness",
                  "not_mutation_adequacy",
                  "not_fuzz_robustness",
                  "not_miri_or_sanitizer_proof",
                  "not_release_packaging",
                  "not_api_stability",
              ],
              "proof_obligation": "Generate coverage.json, coverage.txt, lcov.info, upload GitHub artifact, and upload LCOV to Codecov when CODECOV_TOKEN is present.",
          }
          pathlib.Path("target/coverage/coverage-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )
          PYTHON

      - name: Detect Codecov token
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.codecov-token.outputs.present == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust-core
          name: adze-rust-core
          fail_ci_if_error: ${{ github.event_name == 'push' }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.txt
            lcov.info
            target/coverage/coverage-receipt.json
          retention-days: 14
