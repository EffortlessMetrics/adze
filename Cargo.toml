[workspace]
resolver = "2"
members = [
  "macro",
  "runtime",
  "runtime2",
  "crates/parsetable-metadata",
  "crates/bdd-grammar-analysis-core",
  "crates/bdd-grammar-fixtures",
  "crates/bdd-governance-fixtures",
  "crates/parser-contract",
  "crates/parser-governance-contract",
  "crates/parser-feature-contract",
  "crates/runtime-governance",
  "crates/runtime-governance-api",
  "crates/ts-format-core",
  "crates/runtime-governance-matrix",
  "crates/runtime2-governance",
  "crates/stack-pool-core",
  "crates/glr-versioning",
  "crates/governance-matrix-contract",
  "crates/governance-matrix-core-impl",
  "crates/governance-matrix-core",
  "crates/governance-runtime-profile-core",
  "crates/governance-runtime-core",
  "crates/governance-runtime-reporting",
  "crates/feature-policy-contract",
  "crates/concurrency-map-core",
  "crates/concurrency-plan-core",
  "crates/concurrency-normalize-core",
  "crates/concurrency-parse-core",
  "crates/concurrency-env-core",
  "crates/concurrency-env-vars-core",
  "crates/concurrency-env-contract-core",
  "crates/concurrency-init-classifier-core",
  "crates/concurrency-init-rayon-core",
  "crates/concurrency-init-bootstrap-core",
  "crates/concurrency-init-core",
  "crates/concurrency-caps-core",
  "crates/governance-metadata",
  "crates/linecol-core",
  "crates/error-location-core",
  "crates/bdd-governance-core",
  "crates/bdd-governance-reporting-core",
  "crates/bdd-governance-contract",
  "crates/bdd-contract",
  "crates/governance-contract",
  "crates/bdd-scenario-fixtures",
  "crates/bdd-scenario-core",
  "crates/bdd-grid-contract",
  "crates/bdd-grid-core",
  "crates/feature-policy-core",
  "crates/parser-feature-profile-core",
  "crates/governance-status-core",
  "crates/concurrency-bounded-map-core",
  "crates/concurrency-caps-contract-core",
  "crates/concurrency-init-bootstrap-policy-core",
  "crates/parser-backend-core",
  "crates/grammar-analysis-core",
  "tool",
  "crates/common-syntax-core",
  "common",
  "ir",
  "glr-core",
  "glr-test-support",
  "tablegen",
  "xtask",
  "testing",
  "grammars/javascript",
  "grammars/python",
  "grammars/python-simple",
  "grammars/test-vec-wrapper",
  "grammars/go",
  "lsp-generator",
  "playground",
  "samples/downstream-demo",
  "cli",
  "benchmarks",
  "test-mini",
  "golden-tests",
  "wasm-demo",
  "tests/governance",
]
# These crates are intentionally excluded from default workspace commands
# due to mutually exclusive features. Build them explicitly with -p when needed.
exclude = [
  "runtime/fuzz",
  "tools/ts-bridge",     # build separately to enable grammar features
  "crates/ts-c-harness", # relies on external C/TS libs
  "example",             # has mutually exclusive pure-rust/c-backend features
]


[workspace.package]
authors = ["Steven Zimmerman, CPA <git@effortlesssteven.com>"]
documentation = "https://github.com/effortlessmetrics/adze"
edition = "2024"
homepage = "https://github.com/effortlessmetrics/adze"
license = "Apache-2.0 OR MIT"
publish = false
repository = "https://github.com/effortlessmetrics/adze"
rust-version = "1.93"


[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unexpected_cfgs = "warn"
const_item_interior_mutations = "deny"
function_casts_as_integer = "deny"
missing_docs = "warn"
unused_extern_crates = "deny"

[workspace.lints.clippy]
# Panic-free production and tests
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
out_of_bounds_indexing = "deny"
unchecked_time_subtraction = "deny"

# AST / parser / UTF-8 / slice safety
char_indices_as_byte_indices = "deny"
sliced_string_as_bytes = "deny"
index_refutable_slice = "deny"

# Silent failure
let_underscore_future = "deny"
let_underscore_must_use = "deny"
let_underscore_lock = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
lines_filter_map_ok = "deny"

# Async / concurrency
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
future_not_send = "warn"
large_futures = "warn"
arc_with_non_send_sync = "deny"
rc_mutex = "deny"
mut_mutex_lock = "deny"
readonly_write_lock = "deny"

# Unsafe / memory
mem_forget = "deny"
forget_non_drop = "deny"
drop_non_drop = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
repr_packed_without_abi = "deny"

# Numeric correctness
float_cmp = "deny"
float_cmp_const = "deny"
float_equality_without_abs = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
invalid_upcast_comparisons = "deny"
cast_abs_to_unsigned = "deny"
cast_enum_truncation = "deny"
cast_nan_to_int = "deny"
manual_midpoint = "warn"
manual_is_multiple_of = "warn"
manual_div_ceil = "warn"
arithmetic_side_effects = "warn"

# File/process/path footguns
suspicious_open_options = "deny"
nonsensical_open_options = "deny"
ineffective_open_options = "deny"
path_buf_push_overwrite = "deny"
join_absolute_paths = "deny"
read_line_without_trim = "warn"
exit = "deny"

# API / trait correctness
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
fallible_impl_from = "deny"
error_impl_error = "deny"
result_unit_err = "warn"
result_large_err = "warn"

# Good taste that pays rent
format_in_format_args = "deny"
to_string_in_format_args = "deny"
unused_format_specs = "deny"
unnecessary_debug_formatting = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_strip = "warn"
manual_split_once = "warn"
manual_is_variant_and = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
match_result_ok = "deny"
cloned_instead_of_copied = "warn"
iter_cloned_collect = "warn"
iter_overeager_cloned = "warn"
needless_collect = "warn"
redundant_closure = "warn"
redundant_closure_for_method_calls = "warn"
missing_panics_doc = "deny"
missing_errors_doc = "warn"

# Suppression governance
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"

[workspace.dependencies]
tree-sitter = "=0.26.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
proptest = "1.4"
insta = "1.39"
criterion = { version = "0.5", features = ["html_reports"] }
thiserror = "2.0"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
anyhow = "1.0"
tempfile = "3"
indexmap = "2.0"
bincode = "1.3"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.10"
rustc-hash = "2.1"
smallvec = "1.13"
regex = "1.11"
toml = "0.9.8"

[profile.ci]
inherits = "dev"
debug = 0
lto = "off"
