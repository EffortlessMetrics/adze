# ripr — static RIPR exposure analysis configuration for adze.
#
# ripr inspects changed Rust code and asks whether each behavioural delta
# appears exposed to a meaningful test discriminator. It does not run
# mutants; do not use mutation-runtime language ("killed" / "survived")
# when reading or writing ripr policy.
#
# This config keeps ripr advisory: every severity is "notice" or "warning",
# and the GitHub workflow keeps ripr advisory/non-blocking.
#
# See docs/ci/ripr.md.


[analysis]
mode = "draft"
include_unchanged_tests = true

[reports]
max_related_tests = 8

[severity.findings]
exposed = "note"
weakly_exposed = "warning"
reachable_unrevealed = "warning"
no_static_path = "note"
infection_unknown = "note"
propagation_unknown = "note"
static_unknown = "note"

[severity.seams]
strongly_gripped = "off"
weakly_gripped = "warning"
ungripped = "warning"
reachable_unrevealed = "warning"
activation_unknown = "note"
propagation_unknown = "note"
observation_unknown = "note"
discrimination_unknown = "note"
opaque = "note"
intentional = "off"
suppressed = "off"

[suppressions]
path = "policy/ripr-suppressions.toml"
