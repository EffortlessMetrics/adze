# ripr suppressions for adze.
#
# Each suppression must declare a kind, owner, reason, and expiry. Test
# efficiency suppressions match by test/path; seam suppressions match by the
# fields supported by ripr's suppressions manifest schema.
#
# Empty by default; new entries land alongside the change that needs them.

schema_version = 1

# Example (commented):
# [[suppressions]]
# kind = "test_efficiency"
# test = "cli_prints_help"
# path = "tests/cli.rs"
# owner = "core/docs"
# reason = "Intentionally broad CLI smoke test."
# expires = "2099-09-01"
