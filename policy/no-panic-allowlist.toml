# No-panic allowlist
#
# Receipts for panic-family expressions that are intentionally allowed.
# Authoritative for the semantic checker (`cargo xtask check-no-panic-family`).
#
# Identity:   path + family + selector
# Drift hint: `last_seen` (line + column) — never the matching key.
#
# Families recognized:
#   unwrap                  — `.unwrap()`
#   expect                  — `.expect(...)`
#   panic_macro             — `panic!(...)`
#   todo                    — `todo!(...)`
#   unimplemented           — `unimplemented!(...)`
#   unreachable             — `unreachable!(...)`
#   indexing                — `expr[...]` (non-str literal indexing)
#   string_slice            — `&s[..]` against string-typed receiver
#   get_unwrap              — `.get(...).unwrap()`
#   unchecked_time_subtraction — `Duration` subtraction
#
# Selector kinds:
#   method_call    { container, callee, receiver_fingerprint }
#   macro_invoke   { container, name }
#   index_expr     { container, target_fingerprint }
#
# All entries SHOULD declare:
#   id, path, family, classification, owner, explanation, expires
#
# Stage 1 of the rollout: this file starts empty. The proposed baseline
# generated by `cargo xtask no-panic propose` lands at:
#   target/policy/no-panic-proposed-allowlist.toml
# Owners review, annotate, and copy individual entries here.

schema_version = "0.3"

# [[allow]]
# id = "panic-0001"
# path = "glr-core/src/parser/state.rs"
# family = "unwrap"
# classification = "test_helper"
# owner = "glr-core"
# explanation = "Fixture loader; migrate to fallible builder."
# expires = "2026-09-01"
#
# [allow.selector]
# kind = "method_call"
# container = "load_fixture_table"
# callee = "unwrap"
# receiver_fingerprint = "std::fs::read_to_string(path)"
#
# [allow.last_seen]
# line = 42
# column = 17
