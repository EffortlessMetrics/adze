# Non-Rust file allowlist
#
# Authoritative receipts for non-Rust files in the tree. Every committed file
# whose extension is not on the implicit-allow list (see below) must either be
# matched by a glob entry here, or be backed by a Rust-equivalent and removed.
#
# Implicit-allow extensions (no entry needed):
#   .rs   .toml   .lock   .md   .txt   .gitignore   .editorconfig
#   .snap  .proptest-regressions  .sha256  .sha
#
# Required keys:
#   glob, kind, owner, surface, classification, reason
# Optional keys:
#   covered_by   — list of commands that validate the contents
#   expires      — ISO date; expired entries fail the checker
#   retired      — true means entry is intentionally kept for audit history
#
# The checker `cargo xtask check-file-policy` fails on any unallowlisted
# non-Rust files and on stale entries unless `retired = true`.

schema_version = "1.0"

# ---------------------------------------------------------------------------
# Repository scaffolding
# ---------------------------------------------------------------------------

