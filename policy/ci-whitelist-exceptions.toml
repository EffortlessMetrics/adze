# CI lane whitelist exceptions for adze.
#
# Each exception explains why an expensive or duplicate lane is currently
# allowed on the default PR path. Exceptions must have an owner, an issue
# pointer, and a review/expiry date. They are not permanent.
#
# Lifecycle:
#   1. lane is added to policy/ci-lane-whitelist.toml as expensive=true,
#      default_pr=true; whitelist lint flags it.
#   2. an exception is added here with `allowed = true`.
#   3. the lane is later routed by risk pack and the exception is closed.

schema_version = "1.0"
policy = "ci-whitelist-exceptions"
owner = "release/ci"
status = "active"
updated = "2026-05-08"

[[exception]]
id = "ci-exception-pure-rust-os-matrix-default-pr"
kind = "expensive_default_pr_lane"
lane = "pure-rust-os-matrix"
allowed = true
owner = "core/runtime"
issue = "TODO"
reason = "Default PR matrix is now ubuntu/stable only (~18 LEM) via matrix-setup job. Full OS/toolchain matrix (was 180 LEM) gated to labels/main. Exception kept for whitelist audit; update base_lem in lane entry reflects routed reality."
created = "2026-05-07"
review_after = "2026-06-07"
expires = "2026-08-07"

