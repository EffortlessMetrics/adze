[package]
name = "adze-bdd-scenario-fixtures"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Shared BDD scenario fixtures and GLR conflict helpers for parser/table tests."
repository = "https://github.com/EffortlessMetrics/adze"
publish = ["crates.io"]
keywords = ["bdd", "testing", "scenarios", "parser", "grammar"]
categories = ["development-tools::testing"]
homepage = "https://github.com/EffortlessMetrics/adze"
documentation = "https://docs.rs/adze-bdd-scenario-fixtures"

[features]
default = []
strict_api = []
strict_docs = []

[dependencies]
adze-bdd-governance-core = { version = "0.1.0", path = "../bdd-governance-core" }
adze-bdd-grammar-fixtures = { version = "0.1.0", path = "../bdd-grammar-fixtures" }
adze-governance-runtime-reporting = { version = "0.1.0", path = "../governance-runtime-reporting" }

[dev-dependencies]
adze-ir = { version = "0.8.0-dev", path = "../../ir" }
proptest = { workspace = true }
