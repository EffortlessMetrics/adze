[package]
name = "adze-concurrency-init-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Rayon global thread-pool initialization policy for process-wide concurrency caps."
repository = "https://github.com/EffortlessMetrics/adze"
publish = ["crates.io"]
keywords = ["concurrency", "threading", "caps", "parallel", "rayon"]
categories = ["concurrency"]
homepage = "https://github.com/EffortlessMetrics/adze"
documentation = "https://docs.rs/adze-concurrency-init-core"

[features]
default = []
strict_api = []
strict_docs = []

[dependencies]
adze-concurrency-env-contract-core = { version = "0.1.0", path = "../concurrency-env-contract-core" }
adze-concurrency-normalize-core = { version = "0.1.0", path = "../concurrency-normalize-core" }
rayon.workspace = true

[dev-dependencies]
proptest.workspace = true
